/* mtp-theme:end */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px var(--font); }
  body { padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); overflow-x: hidden; }
  button { font: inherit; font-weight: 700; color: var(--text); background: var(--surface-2); border: 0;
    border-radius: var(--radius-button); min-height: 52px; padding: 0 10px; touch-action: manipulation; }
  button:active { background: var(--line); }
  button:disabled { opacity: .35; }
  button.on { background: var(--accent); color: var(--on-accent); }
  /* player-ui-refresh D7: PLAY while the song plays, same orange as the window */
  button.live { background: var(--live); color: var(--on-live); }
  button.alert { background: var(--danger); color: var(--bg); }
  button.blink { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { opacity: .45; } }
  .hidden { display: none !important; }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header h1 { font-size: 15px; margin: 0; color: var(--muted); flex: 1; }
  /* director-phone-layout D6: narrow phone standing up. Two header rows: title and
     connection pill on top (always visible), the page links below */
  @media (max-width: 459px) {
    header { flex-wrap: wrap; gap: 8px; }
    header h1 { order: 1; } header #pill { order: 2; }
    header::after { content: ""; order: 3; flex-basis: 100%; height: 0; }   /* line break */
    header a.pill { order: 4; flex: 1 1 0; text-align: center; }
  }
  .pill { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--surface); }
  .pill.ok { color: var(--success); } .pill.warn { color: var(--warning); } .pill.bad { color: var(--danger); }

  .card { background: var(--surface); border-radius: var(--radius-card); padding: 10px 12px; margin-bottom: 10px; }
  .label { font-size: 12px; color: var(--muted); letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; }
  .big { font-size: 26px; font-weight: 800; margin-top: 2px; overflow-wrap: anywhere; }
  /* remote-pages-refresh D6: current section in stage size, NO AR while playing */
  #cur { font-size: 32px; line-height: 1.15; }
  @media (max-width: 359px) { #cur { font-size: 26px; } }
  .onair { color: var(--live); font-weight: 800; margin-left: 8px; }
  .onair::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live);
    margin-right: 5px; vertical-align: 1px; }
  /* transition-timing-selector: TROCA pills; lit default in mint, lit chosen in orange.
     Three equal flexible pills (min-width 0) so a portrait phone never scrolls sideways */
  #timing { display: flex; align-items: center; gap: 6px; margin-top: 8px; min-width: 0; }
  #timing .tl { font-size: 11px; color: var(--muted); font-weight: 800; letter-spacing: .06em; flex: none; }
  #timing button { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 4px; font-size: 14px; overflow: hidden; }
  @media (max-width: 359px) { #timing button { font-size: 12px; } #timing .tl { display: none; } }
  .mid { font-size: 18px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
  /* region-hover-and-group-colors D8: the cancel X on the PRÓXIMO card (48 px touch area, the row keeps its height) */
  .nextrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .nextrow .mid { min-width: 0; }
  button.xcancel { flex: 0 0 auto; min-height: 0; height: 48px; width: 56px; margin: -12px -6px -12px 0; padding: 0; background: transparent;
    color: var(--danger); display: inline-flex; align-items: center; justify-content: center; }
  button.xcancel svg { width: 34px; height: 24px; padding: 6px 8px; box-sizing: border-box; border: 2px solid var(--danger); border-radius: 6px; }
  button.xcancel.late { opacity: .31; }
  .badge { font-size: 11px; font-weight: 800; color: var(--warning); margin-left: 6px; }
  .blinktext { animation: blink 1s steps(2, start) infinite; }

  .row { display: grid; gap: 8px; margin-bottom: 8px; }
  .row.two { grid-template-columns: 1fr 1fr; }
  .row.three { grid-template-columns: 1fr 1fr 1fr; }
  .row.transport button { min-height: 64px; font-size: 18px; }

  .list { display: grid; gap: 6px; }
  .list button { text-align: left; min-height: 48px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  /* remote-pages-refresh D5: current/active in mint; next or pending destination with a blinking orange border */
  .list button.current { background: var(--accent); color: var(--on-accent); }
  .list button.current .meta { color: inherit; opacity: .75; }
  .list button.next { box-shadow: inset 0 0 0 2px var(--live); animation: nextring 1s steps(2, start) infinite; }
  .list .tagnext { color: var(--live); font-weight: 800; font-size: 12px; letter-spacing: .04em; }
  @keyframes nextring { to { box-shadow: inset 0 0 0 2px transparent; } }
  .list button.bad { color: var(--danger); }
  .list .meta { color: var(--muted); font-weight: 700; font-size: 14px; flex: none; }
  .list button.next .meta { color: inherit; }
  h2 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; letter-spacing: .04em; }

  /* ui-mock-alignment D5: notice as a pill */
  #toast { position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 12px; font-size: 15px; text-align: center; }
  #blocker { text-align: center; padding: 40px 12px; color: var(--muted); }
  #blocker .mid { color: var(--text); margin-bottom: 8px; }

  input { font: inherit; font-size: 28px; letter-spacing: .3em; text-align: center; width: 100%; padding: 12px;
    border-radius: var(--radius-button); border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input.name { font-size: 18px; letter-spacing: 0; text-align: left; }
  #pair p { color: var(--muted); }
  #pair .row { margin-top: 10px; }

  /* deitado: controles à esquerda, listas à direita, sem rolagem horizontal */
  @media (orientation: landscape) and (min-width: 600px) {
    #control { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 14px; align-items: start; }
    #lists { max-height: calc(100vh - 80px); overflow-y: auto; }
    #lists h2:first-child { margin-top: 0; }
  }
  /* design-system: Wizd Digital credit, only outside the in-use screens */
  .credit { margin: 14px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
  .credit img { height: 22px; width: auto; vertical-align: middle; margin-left: 6px; opacity: .9; }
</style>

<script>
"use strict";
// ======================= protocol (see lib/MTP_RemoteProtocol.lua) =======================
// Everything goes through the REAPER web server API: /_/cmd;cmd;... The page only
// writes and reads ExtState in the MTP_Remote section; the player reads, runs and publishes.
const SEC = "MTP_Remote";
const POLL_MS = 200, BACKOFF_MS = [1000, 2000], CONFIRM_MS = 3000, STALE_HB_MS = 2000, HB_EVERY_MS = 2000;
// act: a window action by name; the phone only sends CancelJump, which needs the rev
const SENSITIVE = { play: 1, pause: 1, prev: 1, next: 1, repeat: 1, loop: 1, click: 1, song: 1, act: 1 };
const enc = encodeURIComponent;
const $ = (id) => document.getElementById(id);

// localStorage may fail (private tab): the page works, it just asks for
// pairing again later.
const store = {
  get(k) { try { return localStorage.getItem("mtp." + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("mtp." + k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem("mtp." + k); } catch (e) {} },
};
function randomId(n) {
  const a = new Uint8Array(n); (crypto.getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 256));
  return Array.from(a, b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
}
const dev = store.get("dev") || (() => { const d = "d" + randomId(15); store.set("dev", d); return d; })();
let token = store.get("token");
let seq = parseInt(store.get("seq") || "0", 10) || 0;

// EXTSTATE value in the REAPER response: \n, \t and \\ come encoded.
function unescapeReaper(s) {
  return s.replace(/\\(.)/g, (_, c) => c === "n" ? "\n" : c === "t" ? "\t" : c);
}
function extOf(rows, key) {
  for (const r of rows) if (r[0] === "EXTSTATE" && r[2] === key) return unescapeReaper(r.slice(3).join("\t"));
  return null;
}
async function api(cmds) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 2500);
  try {
    const res = await fetch("/_/" + cmds.join(";"), { cache: "no-store", signal: ctl.signal });
    const text = res.status === 200 ? await res.text() : "";
    return { status: res.status, rows: text.split("\n").filter(Boolean).map(l => l.split("\t")) };
  } finally { clearTimeout(timer); }
}

// ======================= page state =======================
let state = null;          // last state published by the player
let fresh = false;         // state read after the last (re)connection
let lastHb = null, lastHbAt = 0;
let conn = "connecting";   // connecting | ok | retry | auth | closed | off | unlicensed | unpaired
let failures = 0;
let pending = null;        // { seq, op, rev, arg, text, firstAt, button }
let pairReq = null;        // { nonce, at }
let hbCount = 0, lastHbSent = 0;

function toast(msg, ms) {
  const t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.add("hidden"), ms || 3500);
}

// Another tab of this browser paired or was revoked: follow it right away.
window.addEventListener("storage", (e) => {
  if (e.key !== "mtp.token") return;
  token = e.newValue;
  if (!token) setConn("unpaired");
  render();
  clearTimeout(poll.timer); poll();
});

// ======================= poll loop =======================
async function poll() {
  const cmds = [];
  const now = Date.now();
  if (pending && token) cmds.push("SET/EXTSTATE/" + SEC + "/cmd." + dev + "/" + enc(pending.text));
  if (token && now - lastHbSent > HB_EVERY_MS) {
    cmds.push("SET/EXTSTATE/" + SEC + "/hb." + dev + "/" + (++hbCount)); lastHbSent = now;
  }
  if (pending) cmds.push("GET/EXTSTATE/" + SEC + "/ack." + dev);
  if (pairReq) cmds.push("GET/EXTSTATE/" + SEC + "/pairres." + dev);
  cmds.push("GET/EXTSTATE/" + SEC + "/state");

  let r;
  try { r = await api(cmds); } catch (e) { r = null; }
  if (!r || (r.status !== 200 && r.status !== 401)) {
    failures++; fresh = false; setConn("retry"); render(); return schedule();
  }
  if (r.status === 401) { failures++; fresh = false; setConn("auth"); render(); return schedule(); }
  failures = 0;

  // state and heartbeat
  const raw = extOf(r.rows, "state");
  if (raw) {
    try { state = JSON.parse(raw); } catch (e) { /* half-written state: wait for the next one */ }
  } else {
    state = null;
  }
  if (state && state.hb !== lastHb) { lastHb = state.hb; lastHbAt = now; fresh = true; }
  const alive = state && now - lastHbAt < STALE_HB_MS;

  if (!alive) setConn("closed");
  else if (!state.remoteOn) setConn(state.licensed === false ? "unlicensed" : "off");
  else if (!token || !(state.devices || []).includes(dev)) setConn("unpaired");
  else setConn("ok");
  autoPair();

  if (pending) handleAck(extOf(r.rows, "ack." + dev), now);
  if (pairReq) handlePairRes(extOf(r.rows, "pairres." + dev), now);
  render();
  schedule();
}

function schedule() {
  clearTimeout(poll.timer);
  if (document.hidden) return;   // hidden tab: stop polling
  const wait = failures === 0 ? POLL_MS : BACKOFF_MS[Math.min(failures - 1, BACKOFF_MS.length - 1)];
  poll.timer = setTimeout(poll, wait);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { fresh = false; failures = 0; poll(); }
});

function setConn(c) {
  if (c !== "ok" && pending) { pending.button && pending.button.classList.remove("blink"); }
  conn = c;
}

// ======================= commands =======================
function send(op, arg, button) {
  if (conn !== "ok" || !fresh || !state) return;
  if (pending) { toast("Aguarde a confirmação do comando anterior."); return; }
  seq = Math.max(seq, parseInt(store.get("seq") || "0", 10) || 0) + 1; store.set("seq", String(seq));
  const rev = SENSITIVE[op] ? String(state.rev) : "";
  const text = [state.boot, seq, token, op, rev, arg == null ? "" : String(arg)].join("|");
  pending = { seq, op, arg, text, firstAt: Date.now(), button };
  if (button) button.classList.add("blink");
  clearTimeout(poll.timer); poll();   // send right away
}

function finish(msg) {
  if (pending && pending.button) pending.button.classList.remove("blink");
  pending = null;
  if (msg) toast(msg);
}

function handleAck(raw, now) {
  if (raw) {
    const [boot, s, status] = raw.split("|");
    if (Number(s) === pending.seq && state && boot === state.boot) {
      if (status === "ok") return finish();
      if (status === "stale") return finish("O trecho mudou; confira e toque de novo.");
      if (status === "denied") { token = null; store.del("token"); return finish("Este aparelho precisa ser pareado de novo."); }
      if (status === "off") return finish("Controle remoto desligado no computador.");
      if (pending.op === "act" && pending.arg === "CancelJump") return finish("Tarde demais para cancelar o pulo.");
      return finish("Comando não aceito pelo player.");
    }
  }
  // the player was reopened: the request was for the previous session
  if (state && pending.text.split("|")[0] !== state.boot) return finish("O player foi reaberto; confira e toque de novo.");
  if (now - pending.firstAt > CONFIRM_MS) finish("Não confirmado. Confira no player e toque de novo se precisar.");
}

// ======================= pairing =======================
$("devname").value = store.get("name") || (/iPad/.test(navigator.userAgent) ? "iPad" :
  /iPhone/.test(navigator.userAgent) ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android" : "Aparelho");
async function pairNow() {
  const code = $("code").value.replace(/\D/g, "");
  if (code.length !== 6) { $("pairMsg").textContent = "Digite os 6 dígitos do código."; return; }
  const name = $("devname").value.replace(/[|\n\t]/g, " ").trim().slice(0, 40) || "Aparelho";
  store.set("name", name);
  pairReq = { nonce: randomId(8), at: Date.now() };
  $("pairMsg").textContent = "Pareando…";
  try { await api(["SET/EXTSTATE/" + SEC + "/pair/" + enc([dev, code, pairReq.nonce, name].join("|"))]); }
  catch (e) { $("pairMsg").textContent = "Sem resposta do computador. Tente de novo."; pairReq = null; }
}
$("pairBtn").onclick = pairNow;

// ======================= pairing by QR code (qr-pairing) =======================
// The QR on the REMOTO screen opens this page with "?pair=<6 digits>". The code is
// taken out of the address right away (history and bookmarks never keep it), and
// used once, only when the player says this device is not paired.
let qrCode = null;
try {
  const u = new URL(location.href);
  if (u.searchParams.has("pair")) {
    const v = u.searchParams.get("pair") || "";
    if (/^\d{6}$/.test(v)) qrCode = v;
    u.searchParams.delete("pair");
    history.replaceState(history.state, "", u.pathname + u.search + u.hash);
  }
} catch (e) { /* old browser: manual code entry, as before */ }
function autoPair() {
  if (!qrCode) return;
  if (conn === "ok") { qrCode = null; return; }    // already paired: ignore the code
  if (conn !== "unpaired") return;                 // wait for the player (closed, off, retry)
  $("code").value = qrCode; qrCode = null;
  pairNow();
}
const PAIR_ERRORS = {
  expired: "Código vencido; veja o código novo no computador.",
  wrong: "Código errado. Confira no computador.",
  locked: "Muitas tentativas; veja o código novo no computador.",
  off: "Controle remoto desligado no computador.",
};
function handlePairRes(raw, now) {
  if (raw) {
    const [nonce, ok, value] = raw.split("|");
    if (nonce === pairReq.nonce) {
      pairReq = null;
      if (ok === "ok") { token = value; store.set("token", value); $("code").value = ""; $("pairMsg").textContent = ""; toast("Aparelho pareado."); }
      else $("pairMsg").textContent = PAIR_ERRORS[value] || "Pareamento recusado.";
      return;
    }
  }
  if (now - pairReq.at > 5000) { pairReq = null; $("pairMsg").textContent = "Sem resposta do player. O player está aberto?"; }
}

// ======================= screen =======================
const BLOCKS = {
  connecting: ["Conectando…", ""],
  retry: ["Reconectando…", "Sem resposta do computador. Confira se o celular está no mesmo Wi-Fi."],
  auth: ["Senha do REAPER recusada", "Recarregue a página e entre com o usuário e a senha do servidor web do REAPER."],
  closed: ["Player fechado no computador", "Abra o Multitrack Player no REAPER. Ele pode ficar acoplado no docker."],
  off: ["Controle remoto desligado no computador", "No player, clique em REMOTO e ligue o controle remoto."],
  unlicensed: ["Player sem licença no computador", "Ative a licença no player para usar o controle remoto."],
};
const PILLS = { ok: ["conectado", "ok"], connecting: ["conectando…", "warn"], retry: ["reconectando…", "warn"],
  auth: ["senha recusada", "bad"], closed: ["player fechado", "bad"], off: ["remoto desligado", "warn"],
  unlicensed: ["sem licença", "bad"], unpaired: ["não pareado", "warn"] };

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render() {
  const [pillText, pillCls] = PILLS[conn] || PILLS.connecting;
  const pill = $("pill"); pill.textContent = pillText; pill.className = "pill " + pillCls;
  $("blocker").classList.toggle("hidden", !BLOCKS[conn] || conn === "ok");
  $("pair").classList.toggle("hidden", conn !== "unpaired");
  // while "reconectando", keeps the last control visible, but without buttons
  const showControl = conn === "ok" || (conn === "retry" && state && token);
  $("control").classList.toggle("hidden", !showControl);
  if (BLOCKS[conn] && !showControl) { $("blockTitle").textContent = BLOCKS[conn][0]; $("blockText").textContent = BLOCKS[conn][1]; }
  if (!showControl || !state) return;

  const enabled = conn === "ok" && fresh;
  document.querySelectorAll("#control button").forEach(b => b.disabled = !enabled);

  const song = state.song || {};
  $("songLabel").textContent = song.index && song.total ? `MÚSICA · ${song.index}/${song.total}` : "MÚSICA";
  $("song").textContent = song.name || "—";
  $("playState").textContent = { playing: "TOCANDO", paused: "PAUSADO", stopped: "PARADO" }[state.play] || "";

  const cur = state.cur || {};
  $("cur").textContent = cur.count ? `${cur.name} · ${cur.count}/${cur.total}` : (cur.name || "—");
  $("curBadge").textContent = state.click === "on" || state.click === "leaving" ? "CLICK"
    : state.loop ? "LOOP" : cur.outside ? "FORA DA ESTRUTURA" : "";

  // remote-pages-refresh D6: NO AR only while the song plays (not in the click loop)
  $("curLive").classList.toggle("hidden", !(state.play === "playing" && state.click !== "on" && state.click !== "leaving"));
  const nx = state.next || {};
  $("next").textContent = nx.name ? "> " + nx.name : "—";
  $("next").classList.toggle("blinktext", !!nx.pending);
  $("nextNote").textContent = nx.approx ? "aprox." : "";
  renderTiming(state.timing, enabled);
  // region-hover-and-group-colors D8: the X whenever the window could cancel (absent in older players)
  const xSt = nx.pending && (nx.cancel === "ok" || nx.cancel === "late") ? nx.cancel : null;
  $("nextX").classList.toggle("hidden", !xSt);
  $("nextX").classList.toggle("late", xSt === "late");
  $("nextX").dataset.state = xSt || "";

  $("btnPlay").classList.toggle("live", state.play === "playing");
  $("btnPause").classList.toggle("on", state.play === "paused");
  $("btnFade").classList.toggle("alert", !!state.fading);   // absent in older players
  $("btnLoop").classList.toggle("on", !!state.loop);
  const clickBtn = $("btnClick");
  clickBtn.classList.toggle("alert", state.click === "on" || state.click === "leaving" || state.click === "armed");
  clickBtn.classList.toggle("blink", state.click === "armed" && !(pending && pending.button === clickBtn));
  if (state.click === "unavailable") clickBtn.disabled = true;

  renderList("sections", state.sections || [], (s) => {
    const dest = !s.current && !!nx.pending && !!nx.guid && s.id === "r" + nx.guid;   // regions only (no step id in next)
    const b = el("button", (s.current ? "current " : "") + (dest ? "next " : "") + (s.invalid ? "bad" : ""));
    b.append(el("span", null, s.name), el("span", "meta", s.invalid ? "sem region" : (s.repeats > 1 ? "×" + s.repeats : "")));
    b.disabled = !enabled || s.invalid;
    b.onclick = () => send("jump", s.id, b);
    return b;
  }, nx.pending ? nx.guid : "");   // redraw when the pending destination changes
  $("sectionsTitle").textContent = state.structure ? "ESTRUTURA" : "TRECHOS";

  renderList("setlist", state.setlist || [], (m, i) => {
    const next = m.next && !m.active;
    const b = el("button", (m.active ? "current " : "") + (next ? "next " : "") + (m.missing ? "bad" : ""));
    // click-only-song: a song without VS shows "CLICK 72 · D"
    const tag = m.clickOnly ? "CLICK " + m.bpm + (m.keyLabel ? " · " + m.keyLabel : "") : (m.medley ? "MEDLEY" : "");
    const meta = el("span", "meta", m.missing ? "não encontrada" : tag);
    if (next && !m.missing) meta.prepend(el("span", "tagnext", "PRÓXIMA" + (m.medley ? " · " : "")));
    b.append(el("span", null, (i + 1) + ". " + m.name), meta);
    b.disabled = !enabled || m.missing;
    b.onclick = () => send("song", i + 1, b);
    return b;
  });
  $("setlistTitle").textContent = state.setlistName ? "SETLIST · " + state.setlistName : "SETLIST";
  $("setlistTitle").classList.toggle("hidden", !(state.setlist || []).length);
}

// Redraws the list only when it changes (does not lose the touch in the middle of a poll).
const listCache = {};
function renderList(id, items, make, extra) {
  const key = JSON.stringify(items) + (conn === "ok" && fresh) + (pending ? pending.seq : "") + (extra || "");
  if (listCache[id] === key) return;
  listCache[id] = key;
  const box = $(id); box.replaceChildren(...items.map(make));
}

// TROCA selector: hidden when the player does not publish `timing`; dimmed and inert when
// opts is empty; only the options in opts are shown.
function renderTiming(t, enabled) {
  const box = $("timing");
  const has = !!t && Array.isArray(t.opts);
  box.classList.toggle("hidden", !has);
  if (!has) return;
  const off = t.opts.length === 0;
  box.style.opacity = off ? ".35" : "";
  box.querySelectorAll("button").forEach(b => {
    const m = b.dataset.timing;
    b.classList.toggle("hidden", !off && t.opts.indexOf(m) < 0);
    const lit = !off && t.on === m;
    b.classList.toggle("on", lit && t.on === t.def);
    b.classList.toggle("live", lit && t.on !== t.def);
    b.disabled = off || !enabled;
  });
}
document.querySelectorAll("#timing button").forEach(b => b.onclick = () => send("act", "SetTiming|" + b.dataset.timing, b));

document.querySelectorAll("#controls button[data-op]").forEach(b => b.onclick = () => send(b.dataset.op, null, b));
// dimmed = too late: nothing is sent, same as the X in the window
$("nextX").onclick = () => {
  if ($("nextX").dataset.state === "ok") send("act", "CancelJump", $("nextX")); else toast("Tarde demais para cancelar o pulo.");
};

render();
poll();
</script>
</body>
</html>
